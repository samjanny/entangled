name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Corpus determinism and metadata validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: corpus/tools/requirements.txt

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check --requirement corpus/tools/requirements.txt

      - name: Regenerate corpus
        run: python corpus/tools/generate.py

      - name: Require byte-identical generated output
        run: git diff --exit-code -- corpus

      - name: Validate strict UTF-8 metadata JSON
        shell: python
        run: |
          import json
          from pathlib import Path

          def unique_members(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate object member: {key}")
                  result[key] = value
              return result

          for path in (Path("corpus/corpus.json"), Path("corpus/keys.json")):
              raw = path.read_bytes()
              if raw.startswith(b"\xef\xbb\xbf"):
                  raise ValueError(f"{path}: UTF-8 BOM is forbidden")
              json.loads(raw.decode("utf-8"), object_pairs_hook=unique_members)
